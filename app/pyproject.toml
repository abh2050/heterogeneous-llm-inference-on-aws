[project]
name = "inference-capacity-planner"
version = "0.1.0"
description = "Evidence-aware inference capacity planning"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "plotly>=6,<7", "pydantic>=2.11,<3",
  "huggingface-hub>=0.34,<2", "httpx>=0.28,<1", "pyyaml>=6,<7"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
